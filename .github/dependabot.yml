version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep runtime typings aligned with the Node 22/24 support matrix.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # graphql-request 7 declares graphql 14-16 as peers. Revisit alongside
      # a client upgrade that supports GraphQL 17; do not bypass peer checks.
      - dependency-name: graphql
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The production image stays on Node 24 LTS until a tested runtime migration.
      # Minor/patch base-image updates remain eligible.
      - dependency-name: node
        update-types: ['version-update:semver-major']

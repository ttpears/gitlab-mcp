# Example librechat.yml configuration for GitLab MCP integration
# For LibreChat MCP documentation: https://www.librechat.ai/docs/features/mcp

mcpServers:
  gitlab:
    # SSE transport (recommended for LibreChat)
    type: sse
    url: "http://gitlab-mcp:8008/sse"

    # Server configuration
    serverInstructions: |
      You have DIRECT ACCESS to the user's GitLab instance through the GitLab MCP server.

      IMPORTANT INSTRUCTIONS:

      1. PROACTIVELY SEARCH GitLab whenever the user mentions:
         - Project names, repositories, or codebases
         - Issues, bugs, tickets, or problems
         - Merge requests, PRs, or code reviews
         - Team members, developers, or contributors
         - Code files, functions, or implementations
         - Any work-related topics that might be tracked in GitLab

      2. ALWAYS use search_gitlab tool FIRST before saying "I don't have access" or "I can't find"

      3. When users ask vague questions like "what's the status of X" or "who's working on Y":
         - IMMEDIATELY search GitLab projects, issues, and MRs
         - Look for the project by name
         - Check recent issues and merge requests
         - Find relevant code files if needed

      4. Be AGGRESSIVE with searches - it's better to search and find nothing than to not search at all

      Available Tools:
      - search_gitlab: Global search across everything (USE THIS FIRST!)
      - search_projects: Find repositories by name
      - search_issues: Find issues and bugs
      - search_merge_requests: Find code reviews and MRs
      - browse_repository: Explore code structure
      - get_file_content: Read specific files
      - search_users: Find team members

      For write operations (create_issue, create_merge_request), users will be prompted for authentication.

      REMEMBER: If it might be in GitLab, SEARCH FOR IT! Don't assume - verify!

    # Timeouts
    initTimeout: 30000
    timeout: 120000

    # User-specific variables for authentication
    customUserVars:
      GITLAB_PAT:
        title: "GitLab Personal Access Token"
        description: "Your GitLab Personal Access Token with 'api' scope for full functionality or 'read_api' for read-only access"
        type: password
        required: false
      GITLAB_URL_OVERRIDE:
        title: "GitLab Instance URL (Optional)"
        description: "Your GitLab instance URL (e.g., https://gitlab.yourdomain.com). Leave empty to use server default."
        type: url
        required: false

---


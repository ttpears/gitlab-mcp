<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#FC6D26"/>

  <!-- GitLab Fox/Logo inspired shape -->
  <g transform="translate(256, 256)">
    <!-- Left ear -->
    <path d="M -80 -120 L -120 -60 L -80 -80 Z" fill="#E24329"/>
    <!-- Right ear -->
    <path d="M 80 -120 L 120 -60 L 80 -80 Z" fill="#E24329"/>

    <!-- Main fox head -->
    <path d="M -80 -80 L -40 20 L 0 100 L 40 20 L 80 -80 L 0 -120 Z" fill="#FC6D26"/>

    <!-- Face details -->
    <path d="M -80 -80 L -40 20 L 0 -40 Z" fill="#FCA326"/>
    <path d="M 80 -80 L 40 20 L 0 -40 Z" fill="#FCA326"/>

    <!-- Chin -->
    <path d="M -40 20 L 0 100 L 40 20 L 0 60 Z" fill="#E24329"/>
  </g>

  <!-- MCP Connection dots -->
  <circle cx="140" cy="140" r="16" fill="white" opacity="0.9"/>
  <circle cx="372" cy="140" r="16" fill="white" opacity="0.9"/>
  <circle cx="256" cy="420" r="16" fill="white" opacity="0.9"/>

  <!-- Connection lines -->
  <line x1="140" y1="140" x2="256" y2="256" stroke="white" stroke-width="8" opacity="0.6"/>
  <line x1="372" y1="140" x2="256" y2="256" stroke="white" stroke-width="8" opacity="0.6"/>
  <line x1="256" y1="256" x2="256" y2="420" stroke="white" stroke-width="8" opacity="0.6"/>
</svg>

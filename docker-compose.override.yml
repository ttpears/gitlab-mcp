# Add alongside LibreChat's services. Configure GITLAB_URL and exactly one of
# GITLAB_READ_TOKEN or GITLAB_TOKEN in .env, or omit both for strict per-user auth.
# docker compose -f docker-compose.yml -f docker-compose.override.yml up -d gitlab-mcp api
# Configure LibreChat with librechat.example.yml; send the PAT on every request.
services:
  gitlab-mcp:
    image: ghcr.io/ttpears/gitlab-mcp:4.0.0
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      GITLAB_MCP_PORT: '8008'
    networks:
      - librechat
    restart: unless-stopped
    # The image supplies a real /health check. Publish a host port only if needed.
